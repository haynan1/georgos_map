# Development overrides, loaded automatically by `docker compose up`.
# Hot reload for API and web, debug-friendly settings, and host ports on 127.0.0.1 only.

services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    # `data` is internal (no published ports); joining `edge` exposes it to the host.
    networks: [data, edge]

  migrate:
    image: georgos/api:dev
    build:
      target: dev
    volumes:
      - ./backend:/app

  api:
    image: georgos/api:dev
    build:
      target: dev
    environment:
      ENVIRONMENT: development
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: false

  web:
    image: georgos/web:dev
    build:
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      # Bind mounts from Windows/macOS hosts do not deliver file events reliably.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${WEB_DEV_PORT:-5173}:5173"
    read_only: false
    tmpfs: ["/tmp"]

  # Test runner: `docker compose run --rm api-test`
  api-test:
    image: georgos/api:dev
    build:
      context: ./backend
      target: dev
    profiles: [test]
    command: ["pytest"]
    environment:
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TEST_DATABASE_HOST: db:5432
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

volumes:
  web_node_modules:
