[project]
name = "georgos-api"
version = "0.1.0"
description = "Georgos Map API — gestão de máquinas agrícolas."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "ASYNC", "S", "N",
    "PT", "RET", "PL", "TID", "TC", "DTZ", "PERF", "FAST",
]
ignore = [
    "PLR0913", "PLR0917",  # FastAPI endpoints take their dependencies as parameters.
    "N818",  # Errors are named for the condition (PermissionDenied), as in Django/DRF.
    "PLR2004",  # Magic numbers in tests and HTTP status checks are clearer inline.
    "TC001", "TC002", "TC003",  # FastAPI/Pydantic resolve annotations at runtime.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "PLR2004"]
"migrations/**" = ["N999", "S608"]  # DDL identifiers are validated, not bindable

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^migrations/versions/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
