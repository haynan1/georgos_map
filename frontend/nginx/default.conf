# Serves the built SPA and reverse-proxies /api to the FastAPI service, so the browser
# sees a single origin: first-party cookies, no CORS.

server_tokens off;

upstream georgos_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://georgos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port; the API compares it with the Origin header.
        proxy_set_header Host $http_host;
        # Overwrite (never append): the API trusts this header from the proxy, so a
        # client-supplied X-Forwarded-For must not survive the hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
